name = "twenty-claude"
main = "src/index.js"
compatibility_date = "2025-04-01"

[vars]
ALLOWED_ORIGINS = "https://2juwon.github.io"
DAILY_GAMES = "100"            # 하루 전체 Claude 추리 판 수
DAILY_GAMES_PER_DEVICE = "10"  # 기기(IP)당 하루 판 수
MODEL = "claude-haiku-5-5"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]

[observability]
enabled = true
