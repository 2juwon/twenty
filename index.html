<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>

<body>
<title>스무고개</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 화면 위에 스무 개의 고개(산등성이)가 이어지고, 질문 하나마다 한 고개씩 넘어간다. 아래는 질문 카드 하나. */
:root{
  --bg:#e9efec; --surface:#f7faf8; --ink:#1c2830; --muted:#5e6f6a;
  --ridge:#7d9a8f; --ridge-back:#c3d3cc; --accent:#d9971f; --accent-ink:#1c2830;
  --line:#cfdbd5;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11191d; --surface:#18232a; --ink:#e4ece8; --muted:#94a8a1;
  --ridge:#6f9384; --ridge-back:#2a3b3a; --accent:#f0b443; --accent-ink:#11191d;
  --line:#2b3a3d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11191d; --surface:#18232a; --ink:#e4ece8; --muted:#94a8a1;
  --ridge:#6f9384; --ridge-back:#2a3b3a; --accent:#f0b443; --accent-ink:#11191d;
  --line:#2b3a3d; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;padding-inline:16px}
.wrap{max-width:520px;margin:0 auto;padding-block:20px 32px;display:flex;flex-direction:column;gap:18px;min-height:100%;box-sizing:border-box}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:2rem;margin:0;letter-spacing:.02em}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem}
.count b{color:var(--ink);font-family:var(--display);font-weight:400;font-size:1.25rem}
svg.ridge{width:100%;height:auto;display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 20px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:.85rem;color:var(--muted);letter-spacing:.06em}
.q{font-family:var(--display);font-weight:400;font-size:1.65rem;line-height:1.35;margin:0;text-wrap:balance;word-break:keep-all}
.q em{font-style:normal;color:var(--accent)}
p{margin:0;word-break:keep-all}
.lead{color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:14px 10px;transition:transform .08s ease, background .15s}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.big{font-family:var(--display);font-weight:400;font-size:1.3rem}
.primary{background:var(--ink);color:var(--bg)}
.gold{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.soft{border-color:var(--line);font-size:.95rem;padding:11px 6px}
.soft:hover{border-color:var(--ridge)}
.link{border:none;padding:6px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;align-self:flex-start;font-size:.92rem}
.link:disabled{opacity:.35;cursor:default;text-decoration:none}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hunch{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.85rem}
.hunch i{display:block;width:72px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.hunch i span{display:block;height:100%;background:var(--accent);width:0;transition:width .4s ease}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.9rem;color:var(--muted)}
button.chip{color:var(--ink)}
.answer{font-family:var(--display);font-weight:400;font-size:2.6rem;line-height:1.2;color:var(--accent);margin:0;word-break:keep-all}
input[type=text]{font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
form{display:flex;flex-direction:column;gap:10px}
.note{font-size:.85rem;color:var(--muted)}
.seg{display:inline-flex;align-self:flex-start;border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg-b{border:none;border-radius:999px;padding:7px 16px;font-size:.95rem;color:var(--muted)}
.seg-b[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.extra{font-size:.75rem;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:1px 8px;margin-left:4px}
.thinking{color:var(--muted)}
.dots i{font-style:normal;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
.seg + .seg{margin-top:-8px}
.peak-now{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{r:7}}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.peak-now,.fade,.dots i{animation:none}button{transition:none}}
@media (max-width:380px){.q{font-size:1.4rem}.row3{grid-template-columns:1fr 1fr}}
</style>

// Claude 추리 모드 프롬프트 — 브라우저(claude.ai 안에서)와 중계 서버(worker)가 같이 쓴다
const ANSWERS = ['예', '아니요', '아마도', '아마 아니요', '모르겠어요'];
const CLAUDE_LIMIT = 20, CLAUDE_EXTRA_GUESSES = 3, CLAUDE_MAX_HISTORY = 40;

const TOPIC = {
  all: '무엇이든 (동물, 음식, 물건, 탈것, 장소, 직업, 캐릭터, 자연, 인물 등)',
  celeb: '인물 (실존하는 유명인, 역사 속 인물, 또는 만화·영화·게임 캐릭터)',
};

// history: [{t:'q', text, a}] 질문과 답, [{t:'g', name}] 틀린 추측
function cleanHistory(raw){
  if(!Array.isArray(raw)) return null;
  const out = [];
  for(const h of raw.slice(0, CLAUDE_MAX_HISTORY)){
    if(h && h.t === 'q' && typeof h.text === 'string' && ANSWERS.includes(h.a))
      out.push({t: 'q', text: h.text.slice(0, 80), a: h.a});
    else if(h && h.t === 'g' && typeof h.name === 'string')
      out.push({t: 'g', name: h.name.slice(0, 30)});
    else return null;
  }
  return out;
}

function buildPrompt(theme, history){
  const qs = history.filter(h => h.t === 'q');
  const wrong = history.filter(h => h.t === 'g').map(h => h.name);
  const n = qs.length, mustGuess = n >= CLAUDE_LIMIT;
  const lines = qs.map((h, i) => `${i + 1}. ${h.text} → ${h.a}`).join('\n') || '(아직 없음)';
  return `너는 스무고개 게임에서 상대가 떠올린 것을 맞히는 역할이야.
주제: ${TOPIC[theme] || TOPIC.all}

지금까지 한 질문과 상대의 답:
${lines}

틀린 추측: ${wrong.length ? wrong.join(', ') : '(없음)'}
질문 ${n}개 사용 / 최대 ${CLAUDE_LIMIT}개

규칙:
- 예/아니요로 답할 수 있는 짧고 쉬운 한국어 질문을 하나만 해. 이미 한 질문과 같은 뜻의 질문은 하지 마.
- 남은 후보를 절반쯤 나누는 질문이 좋아. 초반엔 넓게, 후반엔 구체적으로.
- '아마도', '아마 아니요', '모르겠어요'는 약한 정보야. 상대가 한두 번 잘못 답했을 수도 있다고 생각해.
- 인물이라면 건강, 종교, 성적 지향, 정치 성향, 범죄, 사생활은 묻지 마.
- 70% 이상 확신이 들면 추측해. 틀린 추측은 다시 하지 마.
${mustGuess ? '- 질문을 다 썼으니 지금은 반드시 가장 가능성 높은 답을 추측해.\n' : ''}
JSON 하나만 출력해:
{"type":"ask","question":"질문"} 또는 {"type":"guess","name":"정식 이름","confidence":0.0~1.0}`;
}

// 모델 답에서 JSON을 꺼내 검사한다
function parseReply(text){
  if(typeof text !== 'string') return null;
  const m = text.match(/\{[\s\S]*\}/); if(!m) return null;
  let o; try{ o = JSON.parse(m[0]); }catch(e){ return null; }
  return checkReply(o);
}
function checkReply(o){
  if(!o || typeof o !== 'object') return null;
  if(o.type === 'ask' && typeof o.question === 'string' && o.question.trim())
    return {type: 'ask', question: o.question.trim().slice(0, 80)};
  if(o.type === 'guess' && typeof o.name === 'string' && o.name.trim())
    return {type: 'guess', name: o.name.trim().slice(0, 30), confidence: Number(o.confidence) || 0};
  return null;
}

function Engine(theme, learned){
  const Q = theme.q, KEYS = Object.keys(Q);
  const items = theme.items.map(it => ({n: it.n, a: it.a || [], v: Object.assign({}, it.v), def: 0, plays: 0}));
  const byName = new Map();
  items.forEach((it, i) => [it.n, ...it.a].forEach(x => { if(!byName.has(norm(x))) byName.set(norm(x), i); }));

  // 학습 기록 반영: 질문마다 [합, 횟수]
  if(learned && learned.items){
    for(const name in learned.items){
      const rec = learned.items[name];
      let i = byName.get(norm(name));
      if(i === undefined){
        i = items.push({n: name, a: [], v: {}, def: CONFIG.newDefault, plays: 0, learned: true}) - 1;
        byName.set(norm(name), i);
      }
      const it = items[i];
      for(const k in rec){
        if(!(k in Q) || !Array.isArray(rec[k])) continue;
        const [s, c] = rec[k]; if(!c) continue;
        const base = (k in it.v) ? it.v[k] : it.def;
        const bw = it.learned ? 1 : CONFIG.baseWeight;
        it.v[k] = (base*bw + s) / (bw + c);
      }
      it.plays = (learned.plays && learned.plays[name]) || 0;
    }
  }

  const val = (it, k) => (k in it.v) ? it.v[k] : it.def;
  // 실제 값 v인 항목에 대해 사람이 a(1, .75, .25, 0)라고 답할 가능도
  function lik(v, a){
    const s = CONFIG.slip;
    const agree = 1 - Math.abs(a - v);         // 0..1
    return s + (1 - 2*s) * agree;
  }

  const st = {answers: [], excluded: new Set(), lastGuessQn: -1};

  function weights(){
    return items.map((it, i) => {
      if(st.excluded.has(i)) return 0;
      let w = 1 + Math.min(it.plays, 10) * 0.05;   // 자주 나온 답은 살짝 우대
      for(const {k, a} of st.answers) if(a !== null) w *= lik(val(it, k), a);
      return w;
    });
  }
  function ranked(W){
    let tot = 0; const r = [];
    W.forEach((w, i) => { tot += w; if(w > 0) r.push(i); });
    r.sort((x, y) => W[y] - W[x]);
    return {order: r, tot, p: tot ? W[r[0]] / tot : 0, p2: tot && r[1] !== undefined ? W[r[1]] / tot : 0};
  }
  function entropy(arr){
    let s = 0; for(const x of arr) s += x; if(!s) return 0;
    let h = 0; for(const x of arr) if(x > 0){ const p = x/s; h -= p*Math.log2(p); }
    return h;
  }
  function pickKey(W, tot, rnd){
    const asked = new Set(st.answers.map(x => x.k));
    // 후보가 많을 땐 상위 후보 위주로 계산 (빠르게)
    const idx = W.map((w, i) => i).filter(i => W[i] > tot * 1e-4);
    const scored = [];
    for(const k of KEYS){
      if(asked.has(k)) continue;
      const wy = [], wn = []; let py = 0, spread = 0;
      for(const i of idx){
        const w = W[i], v = val(items[i], k);
        wy.push(w*lik(v, 1)); wn.push(w*lik(v, 0));
        py += w*v; spread += w*Math.abs(v - 0.5);
      }
      const sum = idx.reduce((s, i) => s + W[i], 0) || 1;
      py /= sum;
      // 기대 엔트로피 + '모르겠어요'가 나올 만한 애매한 질문에 약간의 벌점
      const amb = 1 - 2*spread/sum;
      scored.push({k, s: py*entropy(wy) + (1-py)*entropy(wn) + amb*0.35});
    }
    if(!scored.length) return null;
    scored.sort((a, b) => a.s - b.s);
    const near = scored.filter(x => x.s - scored[0].s < 0.03).slice(0, 3);
    return near[Math.floor((rnd || Math.random)() * near.length)].k;
  }

  // 다음 행동: {type:'ask', k} | {type:'guess', i, p} | {type:'none'}
  function decide(limit, rnd){
    const W = weights(); const R = ranked(W);
    const qn = st.answers.length;
    if(!R.order.length) return {type: 'none'};
    const top = R.order[0];
    if(qn >= limit) return {type: 'guess', i: top, p: R.p};
    if(qn >= CONFIG.minQ && qn > st.lastGuessQn && (R.p >= CONFIG.guessP || (R.p >= 0.6 && R.p >= 12*R.p2)))
      return {type: 'guess', i: top, p: R.p};
    const k = pickKey(W, R.tot, rnd);
    if(!k) return {type: 'guess', i: top, p: R.p};
    return {type: 'ask', k, p: R.p};
  }
  function top(n){ const W = weights(); return ranked(W).order.slice(0, n); }
  function find(name){ return byName.get(norm(name)); }

  return {Q, KEYS, items, st, val, decide, top, find, weights};
}

function norm(s){ return String(s).trim().toLowerCase().replace(/\s+/g, ''); }

// 학습 기록에 한 판의 답을 더한다
function learnInto(learned, name, answers){
  learned.items = learned.items || {}; learned.plays = learned.plays || {};
  const rec = learned.items[name] = learned.items[name] || {};
  for(const {k, a} of answers){ if(a === null) continue; const r = rec[k] = rec[k] || [0, 0]; r[0] += a; r[1] += 1; }
  learned.plays[name] = (learned.plays[name] || 0) + 1;
  return learned;
}



// 화면 (DATA, Engine, learnInto, CONFIG, norm 은 빌드할 때 위에 들어온다)
const THEMES = {
  all:{label:'모든 것', chips:['동물','음식','물건','탈것','장소','직업','캐릭터','자연'],
    prompt:'머릿속에 무언가 하나를 떠올려 주세요.', eg:'예: 고구마', unit:'개', who:'무엇을',
    old:'seumugogae-learned-v1'},
  celeb:{label:'연예인', chips:['가수·아이돌','배우','예능인','운동선수','유튜버','감독'],
    prompt:'유명한 사람을 한 명 떠올려 주세요.', eg:'예: 김종국', unit:'명', who:'누구를',
    old:'seumugogae-learned-celeb-v1'}
};
const ORD = ['첫','두','세','네','다섯','여섯','일곱','여덟','아홉','열','열한','열두','열세','열네','열다섯','열여섯','열일곱','열여덟','열아홉','스무','스물한','스물두','스물세','스물네','스물다섯'];
const BASE_LIMIT = 20, EXTRA = 5, END_GUESSES = 3;

let theme = 'all', E = null, learned = null;
let cur = null, guessIdx = -1, phase = 'intro', limit = BASE_LIMIT, endWrong = 0, extended = false;

function storeKey(){ return 'seumugogae-v2-' + theme; }
function loadLearned(){
  let L = null;
  try{ L = JSON.parse(localStorage.getItem(storeKey())); }catch(e){}
  if(!L || typeof L !== 'object') L = {items:{}, plays:{}};
  // 예전 버전 기록 옮기기
  try{
    const old = JSON.parse(localStorage.getItem(THEMES[theme].old));
    if(Array.isArray(old) && old.length){
      old.forEach(o => { if(o && o.name && o.ans) learnInto(L, o.name, Object.keys(o.ans).map(k => ({k, a:o.ans[k]}))); });
      localStorage.removeItem(THEMES[theme].old); saveLearned(L);
    }
  }catch(e){}
  return L;
}
function saveLearned(L){ try{ localStorage.setItem(storeKey(), JSON.stringify(L)); return true; }catch(e){ return false; } }
function setTheme(t){ theme = THEMES[t] ? t : 'all'; try{ localStorage.setItem('seumugogae-theme', theme); }catch(e){} }
try{ setTheme(localStorage.getItem('seumugogae-theme') || 'all'); }catch(e){ setTheme('all'); }

// 모드: basic = 데이터 기반 엔진, claude = Claude가 추리
let mode = 'basic', sampleFn = null;
try{ mode = localStorage.getItem('seumugogae-mode') === 'claude' ? 'claude' : 'basic'; }catch(e){}
function setMode(m){ mode = m; try{ localStorage.setItem('seumugogae-mode', m); }catch(e){} }
const claudeReady = () => !!sampleFn || !!(SITE.workerUrl && !window.claude);
if(window.claude && window.claude.use){
  window.claude.use('sample').then(s => { if(s){ sampleFn = s; if(phase === 'intro') intro(); } }).catch(() => {});
}
function track(name, params){ try{ if(window.gtag) window.gtag('event', name, Object.assign({theme, mode}, params || {})); }catch(e){} }
const CLAUDE_THEMES = {
  all:{label:'모든 것', chips:['무엇이든','동물','음식','물건','장소','캐릭터'], prompt:'머릿속에 무언가 하나를 떠올려 주세요.'},
  celeb:{label:'인물', chips:['연예인','역사 인물','운동선수','캐릭터','유튜버'], prompt:'인물을 한 명 떠올려 주세요.'}
};

const card = document.getElementById('card');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(html){ card.classList.remove('fade'); void card.offsetWidth; card.innerHTML = html; card.classList.add('fade'); }
const $ = id => document.getElementById(id);

function ridge(n){
  const svg = $('ridge');
  const xs = i => 12 + i*(376/19);
  const ys = i => i === 19 ? 14 : 58 - 30*Math.abs(Math.sin(i*2.1 + 0.7)) - i*0.6;
  let back = 'M0 96 L0 70', front = 'M0 96 L0 80';
  for(let i=0;i<20;i++){
    const x = xs(i), y = ys(i), vx = x - 376/38;
    back += ` L${(vx+4).toFixed(1)} ${(y+30).toFixed(1)} L${(x+6).toFixed(1)} ${(y+8).toFixed(1)}`;
    front += ` L${vx.toFixed(1)} ${Math.min(88, y+28).toFixed(1)} L${x.toFixed(1)} ${y.toFixed(1)}`;
  }
  back += ' L400 66 L400 96 Z'; front += ' L400 78 L400 96 Z';
  let dots = '';
  for(let i=0;i<20;i++){
    const x = xs(i).toFixed(1), y = ys(i).toFixed(1);
    if(i < n) dots += `<circle cx="${x}" cy="${y}" r="4.5" fill="var(--accent)"/>`;
    else if(i === n && phase === 'play') dots += `<circle class="peak-now" cx="${x}" cy="${y}" r="5" fill="var(--bg)" stroke="var(--accent)" stroke-width="2.5"/>`;
    else dots += `<circle cx="${x}" cy="${y}" r="3" fill="var(--bg)" stroke="var(--ridge)" stroke-width="1.5"/>`;
  }
  svg.innerHTML = `<path d="${back}" fill="var(--ridge-back)"/><path d="${front}" fill="var(--ridge)"/>${dots}`;
  $('count').innerHTML = phase === 'intro' ? `<b>20</b>개의 고개`
    : n > 20 ? `<b>${n}</b> / ${limit} 고개 <span class="extra">연장전</span>` : `<b>${n}</b> / ${limit} 고개`;
}

function intro(){
  cTok++; if(cCtl){ try{ cCtl.abort(); }catch(e){} cCtl = null; }
  phase = 'intro'; cur = null; limit = BASE_LIMIT; endWrong = 0; extended = false;
  learned = loadLearned();
  E = Engine(DATA[theme], learned);
  ridge(0);
  if(mode === 'claude' && !claudeReady()) mode = 'basic';
  const isC = mode === 'claude';
  const T = isC ? CLAUDE_THEMES[theme] : THEMES[theme];
  const labels = isC ? CLAUDE_THEMES : THEMES;
  const learnedN = Object.keys(learned.items || {}).length;
  const note = isC
    ? (sampleFn ? 'Claude가 직접 질문을 만들어 추리해요. 내 Claude 사용량으로 돌아가요.' : `Claude가 직접 질문을 만들어 추리해요. 한 사람당 하루 ${SITE.perDevice || 10}판까지 할 수 있어요.`)
    : `아는 ${theme === 'celeb' ? '사람' : '것'} ${E.items.length}${T.unit} · 질문 ${E.KEYS.length}가지${learnedN ? ` · 이 기기에서 배운 것 ${learnedN}${T.unit}` : ''}`;
  show(`
    ${claudeReady() ? `<div class="seg" role="group" aria-label="모드"><button class="seg-b" data-m="basic" aria-pressed="${!isC}">기본</button><button class="seg-b" data-m="claude" aria-pressed="${isC}">Claude 추리</button></div>` : ''}
    <div class="seg" role="group" aria-label="주제">${Object.keys(labels).map(t => `<button class="seg-b" data-t="${t}" aria-pressed="${t === theme}">${labels[t].label}</button>`).join('')}</div>
    <h2 class="q">${T.prompt}</h2>
    <p class="lead">예, 아니요로 답할 수 있는 질문을 스무 번까지 할게요. 헷갈리면 '아마도'나 '모르겠어요'를 눌러도 괜찮아요.</p>
    <div class="chips">${T.chips.map(c => `<span class="chip">${c}</span>`).join('')}</div>
    <button class="primary big" id="start">생각했어요, 시작!</button>
    <p class="note">${note}</p>`);
  card.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { if(b.dataset.t !== theme){ setTheme(b.dataset.t); intro(); } });
  card.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { if(b.dataset.m !== mode){ setMode(b.dataset.m); intro(); } });
  $('start').onclick = () => { track('game_start'); isC ? cStart() : next(); };
}

function next(){
  phase = 'play';
  const d = E.decide(limit);
  if(d.type === 'none') return lose();
  if(d.type === 'guess') return guess(d.i);
  ask(d.k, d.p);
}

function ask(k, p){
  phase = 'play'; cur = k; const qn = E.st.answers.length; ridge(qn);
  if(p === undefined){ const W = E.weights(); const tot = W.reduce((a,b)=>a+b,0); p = tot ? Math.max(...W)/tot : 0; }
  const label = p > .6 ? '거의 알 것 같아요' : p > .3 ? '감이 오고 있어요' : '아직 감 잡는 중';
  show(`
    <span class="eyebrow">${ORD[qn] || (qn+1)+''} 번째 고개${qn >= 20 ? ' · 연장전' : ''}</span>
    <h2 class="q">${esc(E.Q[k])}</h2>
    <div class="row">
      <button class="primary big" data-a="1">예</button>
      <button class="big" data-a="0">아니요</button>
    </div>
    <div class="row3">
      <button class="soft" data-a="0.75">아마도요</button>
      <button class="soft" data-a="null">모르겠어요</button>
      <button class="soft" data-a="0.25">아마 아니요</button>
    </div>
    <div class="foot">
      <button class="link" id="undo" ${qn ? '' : 'disabled'}>이전 질문으로</button>
      <span class="hunch">${label}<i><span style="width:${Math.round(Math.min(1,p)*100)}%"></span></i></span>
    </div>`);
  card.querySelectorAll('[data-a]').forEach(b => b.onclick = () => answer(b.dataset.a === 'null' ? null : Number(b.dataset.a)));
  $('undo').onclick = undo;
}

function answer(a){ if(phase !== 'play' || !cur) return; E.st.answers.push({k:cur, a}); cur = null; next(); }
function undo(){
  if(!E.st.answers.length) return;
  const last = E.st.answers.pop();
  E.st.lastGuessQn = Math.min(E.st.lastGuessQn, E.st.answers.length - 1);
  ask(last.k);
}

function guess(i){
  phase = 'guess'; guessIdx = i; E.st.lastGuessQn = E.st.answers.length; ridge(E.st.answers.length);
  const n = E.st.answers.length, again = E.st.excluded.size > 0;
  show(`
    <span class="eyebrow">${n}개의 고개를 넘었어요</span>
    <h2 class="q">${again ? '그럼 혹시…' : '혹시 생각한 게…'}</h2>
    <p class="answer">${esc(E.items[i].n)}</p>
    <div class="row">
      <button class="gold big" id="yes">맞아요!</button>
      <button class="big" id="no">아니에요</button>
    </div>`);
  $('yes').onclick = win;
  $('no').onclick = () => {
    E.st.excluded.add(guessIdx);
    if(E.st.answers.length >= limit){
      endWrong++;
      if(endWrong >= END_GUESSES) return extended ? lose() : offerExtra();
    }
    next();
  };
}

function offerExtra(){
  phase = 'end'; ridge(E.st.answers.length);
  show(`
    <span class="eyebrow">스무 고개를 다 넘었어요</span>
    <h2 class="q">아깝네요. 다섯 고개만 더 넘어 볼까요?</h2>
    <p class="lead">질문을 다섯 개 더 하고 다시 맞혀 볼게요.</p>
    <div class="row">
      <button class="gold big" id="more">연장전 가기</button>
      <button class="big" id="giveup">정답 알려 주기</button>
    </div>`);
  $('more').onclick = () => { extended = true; limit = BASE_LIMIT + EXTRA; endWrong = 0; next(); };
  $('giveup').onclick = lose;
}

function remember(name){
  learnInto(learned, name, E.st.answers);
  return saveLearned(learned);
}

function win(){
  phase = 'end'; ridge(E.st.answers.length);
  const n = E.st.answers.length, name = E.items[guessIdx].n;
  remember(name);
  track('game_end', {result:'win', questions:n});
  show(`
    <span class="eyebrow">맞혔어요</span>
    <p class="answer">${esc(name)}</p>
    <p class="lead">${n ? ORD[Math.max(0,n-1)] + ' 번째 고개에서 맞혔어요.' : '질문 없이 바로 맞혔어요.'} ${E.st.excluded.size ? `(${E.st.excluded.size}번 틀린 뒤에)` : ''}</p>
    <p class="note">이번 답들도 기록해 뒀어요. 플레이할수록 이 기기에서 더 잘 맞혀요.</p>
    <button class="primary big" id="again">한 번 더 하기</button>`);
  $('again').onclick = intro;
}

function lose(){
  phase = 'end'; ridge(E.st.answers.length);
  const T = THEMES[theme];
  const top = E.top(4);
  track('game_end', {result:'lose', questions:E.st.answers.length});
  show(`
    <span class="eyebrow">제가 졌어요</span>
    <h2 class="q">${T.who} 생각하셨어요?</h2>
    ${top.length ? `<div class="chips">${top.map(i => `<button class="chip" data-n="${esc(E.items[i].n)}">${esc(E.items[i].n)}</button>`).join('')}</div>` : ''}
    <form id="teach">
      <label class="note" for="answer">정답을 알려 주시면 다음엔 맞혀 볼게요</label>
      <input type="text" id="answer" maxlength="20" placeholder="${esc(T.eg)}" autocomplete="off" list="names">
      <datalist id="names">${E.items.map(it => `<option value="${esc(it.n)}">`).join('')}</datalist>
      <button class="primary big" type="submit">알려 주기</button>
    </form>
    <button class="link" id="skip">그냥 다시 하기</button>`);
  card.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { $('answer').value = b.dataset.n; });
  $('skip').onclick = intro;
  $('teach').onsubmit = e => {
    e.preventDefault();
    let name = $('answer').value.trim().slice(0,20);
    if(!name){ $('answer').focus(); return; }
    const known = E.find(name);
    if(known !== undefined) name = E.items[known].n;   // 별명으로 써도 같은 항목으로
    const ok = remember(name);
    show(`
      <span class="eyebrow">고마워요</span>
      <p class="answer">${esc(name)}</p>
      <p class="lead">${!ok ? '이 브라우저에서는 저장이 막혀 있어서 기억하지 못했어요.'
        : known !== undefined ? '알고 있던 건데 놓쳤네요. 이번 답을 반영해서 다음엔 맞혀 볼게요.'
        : '처음 듣는 거예요. 이 기기에 기억해 뒀다가 다음 판부터 맞혀 볼게요.'}</p>
      <button class="primary big" id="again">한 번 더 하기</button>`);
    $('again').onclick = intro;
  };
}

document.addEventListener('keydown', e => {
  if(phase !== 'play' || e.target.tagName === 'INPUT') return;
  const f = mode === 'claude' ? cAnswer : answer;
  if(e.key === 'y' || e.key === 'Y') f(mode === 'claude' ? '예' : 1);
  if(e.key === 'n' || e.key === 'N') f(mode === 'claude' ? '아니요' : 0);
});

// ───────── Claude 추리 모드 ─────────
let cHist = [], cGame = '', cQ = null, cEndWrong = 0, cCtl = null, cGuessName = '', cTok = 0;
const cQn = () => cHist.filter(h => h.t === 'q').length;
const ERR = {
  daily_limit: '오늘 준비된 Claude 추리 판이 다 찼어요. 내일 다시 오거나 기본 모드로 해 보세요.',
  device_limit: '이 기기에서 오늘 할 수 있는 Claude 추리를 다 썼어요. 기본 모드로 해 보세요.',
  turn_limit: '이번 판에서 쓸 수 있는 질문을 다 썼어요.',
  unknown_game: '판 정보가 사라졌어요. 새로 시작해 주세요.',
  rate_limited: 'Claude 사용량이 잠깐 몰렸어요. 조금 뒤에 다시 해 주세요.',
  not_granted: 'Claude 사용을 허용하지 않아서 이 모드를 쓸 수 없어요. 기본 모드로 해 보세요.',
};

async function claudeTurn(){
  if(sampleFn){
    cCtl = new AbortController();
    const o = await sampleFn.json(buildPrompt(theme, cHist), {modelTier:'quick', cache:false, signal:cCtl.signal});
    const r = checkReply(o); if(!r) throw {code:'bad_reply'}; return r;
  }
  let res;
  try{
    res = await fetch(SITE.workerUrl + '/api/turn', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({theme, history:cHist, gameId:cGame || undefined})});
  }catch(e){ throw {code:'network'}; }
  const j = await res.json().catch(() => ({}));
  if(j.gameId) cGame = j.gameId;
  if(!res.ok) throw {code: j.error || 'upstream', status: j.status || res.status};
  const r = checkReply(j); if(!r) throw {code:'bad_reply'}; return r;
}

function cStart(){ cHist = []; cGame = ''; cEndWrong = 0; limit = CLAUDE_LIMIT; cNext(); }

async function cNext(){
  phase = 'think'; ridge(cQn());
  show(`
    <span class="eyebrow">${ORD[cQn()] || ''} 번째 고개</span>
    <h2 class="q thinking">Claude가 생각하고 있어요<span class="dots"><i>.</i><i>.</i><i>.</i></span></h2>
    <p class="note">보통 몇 초 걸려요.</p>`);
  const tok = ++cTok; let r;
  try{ r = await claudeTurn(); }
  catch(e){ if(tok !== cTok) return; return cError(e && e.code, e && e.status); }
  if(tok !== cTok || phase !== 'think') return;   // 그사이 처음으로 돌아갔으면 무시
  if(r.type === 'guess' || cQn() >= CLAUDE_LIMIT + 2) return cGuess(r.type === 'guess' ? r.name : null);
  cAsk(r.question);
}

function cError(code, status){
  if(code === 'cancelled') return;
  phase = 'end';
  const fatal = code in ERR && code !== 'rate_limited';
  show(`
    <span class="eyebrow">잠깐만요</span>
    <h2 class="q">${esc(ERR[code] || 'Claude가 잠깐 응답하지 않아요. 다시 시도해 주세요.')}</h2>
    <div class="row">
      ${fatal ? '' : '<button class="primary big" id="retry">다시 시도</button>'}
      <button class="big" id="basic">기본 모드로</button>
    </div>
    <button class="link" id="home">처음으로</button>
    <p class="note">오류 코드: ${esc(code || 'unknown')}${status ? ' ' + esc(status) : ''}</p>`);
  if($('retry')) $('retry').onclick = cNext;
  $('basic').onclick = () => { setMode('basic'); intro(); };
  $('home').onclick = intro;
}

function cAsk(text){
  phase = 'play'; cQ = text; const qn = cQn(); ridge(qn);
  show(`
    <span class="eyebrow">${ORD[qn] || (qn+1)} 번째 고개 · Claude</span>
    <h2 class="q">${esc(text)}</h2>
    <div class="row">
      <button class="primary big" data-c="예">예</button>
      <button class="big" data-c="아니요">아니요</button>
    </div>
    <div class="row3">
      <button class="soft" data-c="아마도">아마도요</button>
      <button class="soft" data-c="모르겠어요">모르겠어요</button>
      <button class="soft" data-c="아마 아니요">아마 아니요</button>
    </div>
    <div class="foot">
      <button class="link" id="undo" ${qn ? '' : 'disabled'}>이전 질문으로</button>
    </div>`);
  card.querySelectorAll('[data-c]').forEach(b => b.onclick = () => cAnswer(b.dataset.c));
  $('undo').onclick = cUndo;
}
function cAnswer(a){ if(phase !== 'play' || !cQ) return; cHist.push({t:'q', text:cQ, a}); cQ = null; cNext(); }
function cUndo(){
  for(let i = cHist.length - 1; i >= 0; i--){
    if(cHist[i].t === 'q'){ const last = cHist[i]; cHist = cHist.slice(0, i); return cAsk(last.text); }
  }
}

function cGuess(name){
  if(!name) return cLose();
  phase = 'guess'; cGuessName = name; ridge(cQn());
  const again = cHist.some(h => h.t === 'g');
  show(`
    <span class="eyebrow">${cQn()}개의 고개를 넘었어요 · Claude</span>
    <h2 class="q">${again ? '그럼 혹시…' : '혹시 생각한 게…'}</h2>
    <p class="answer">${esc(name)}</p>
    <div class="row">
      <button class="gold big" id="yes">맞아요!</button>
      <button class="big" id="no">아니에요</button>
    </div>`);
  $('yes').onclick = cWin;
  $('no').onclick = () => {
    cHist.push({t:'g', name});
    if(cQn() >= CLAUDE_LIMIT && ++cEndWrong >= CLAUDE_EXTRA_GUESSES) return cLose();
    cNext();
  };
}

function cReport(won, name){
  track('game_end', {result: won ? 'win' : 'lose', questions: cQn()});
  if(sampleFn || !SITE.workerUrl || !cGame) return;
  fetch(SITE.workerUrl + '/api/result', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({gameId:cGame, theme, won, name, questions:cQn()})}).catch(() => {});
}

function cWin(){
  phase = 'end'; ridge(cQn());
  cReport(true, cGuessName);
  const n = cQn(), wrong = cHist.filter(h => h.t === 'g').length;
  show(`
    <span class="eyebrow">Claude가 맞혔어요</span>
    <p class="answer">${esc(cGuessName)}</p>
    <p class="lead">${n ? ORD[Math.max(0, n-1)] + ' 번째 고개에서 맞혔어요.' : '질문 없이 바로 맞혔어요.'} ${wrong ? `(${wrong}번 틀린 뒤에)` : ''}</p>
    <button class="primary big" id="again">한 번 더 하기</button>`);
  $('again').onclick = intro;
}

function cLose(){
  phase = 'end'; ridge(cQn());
  const wrong = cHist.filter(h => h.t === 'g').map(h => h.name);
  show(`
    <span class="eyebrow">Claude가 졌어요</span>
    <h2 class="q">${theme === 'celeb' ? '누구를' : '무엇을'} 생각하셨어요?</h2>
    ${wrong.length ? `<p class="note">틀린 추측: ${wrong.map(esc).join(', ')}</p>` : ''}
    <form id="teach">
      <label class="note" for="answer">정답을 알려 주시면 게임 데이터를 늘리는 데 참고할게요</label>
      <input type="text" id="answer" maxlength="20" placeholder="${esc(THEMES[theme].eg)}" autocomplete="off">
      <button class="primary big" type="submit">알려 주기</button>
    </form>
    <button class="link" id="skip">그냥 다시 하기</button>`);
  $('skip').onclick = () => { cReport(false, ''); intro(); };
  $('teach').onsubmit = e => {
    e.preventDefault();
    const name = $('answer').value.trim().slice(0, 20);
    if(!name){ $('answer').focus(); return; }
    cReport(false, name);
    show(`
      <span class="eyebrow">고마워요</span>
      <p class="answer">${esc(name)}</p>
      <p class="lead">${sampleFn || !SITE.workerUrl ? '다음엔 꼭 맞혀 볼게요.' : '알려 주신 정답은 게임 데이터를 늘리는 데 참고할게요.'}</p>
      <button class="primary big" id="again">한 번 더 하기</button>`);
    $('again').onclick = intro;
  };
}

intro();

})();
</script>
</body>
</html>
